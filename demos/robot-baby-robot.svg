<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="baby-robot" >
                    <style>.eye-text{font-family:Arial,sans-serif;font-weight:900}</style><defs>
                        <!-- Gradient for Robot Head Shell -->
                        <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#4d628c" />
                            <stop offset="50%" stop-color="#2a3859" />
                            <stop offset="100%" stop-color="#192238" />
                        </linearGradient>

                        <!-- Inner Visor Faceplate Gradient -->
                        <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#141c30" />
                            <stop offset="100%" stop-color="#0a0e1a" />
                        </linearGradient>

                        <!-- Ear Cup Accent Gradient -->
                        <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#7a96c2" />
                            <stop offset="100%" stop-color="#3b4d70" />
                        </linearGradient>

                        <!-- Soft Glow Filter for Eyes & Antenna -->
                        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="3" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>

                    <!-- Background Outer Halo Glow -->
                    <circle cx="100" cy="100" r="82" fill="none" stroke="rgba(77, 243, 255, 0.25)" stroke-width="2" filter="url(#glow)"/>

                    <!-- Headset Top Band -->
                    <path d="M 50 85 A 55 55 0 0 1 150 85" fill="none" stroke="#5a739c" stroke-width="5" stroke-linecap="round"/>

                    <!-- Antenna Stem -->
                    <line x1="100" y1="48" x2="100" y2="28" stroke="#6884b3" stroke-width="3" stroke-linecap="round"/>
                    <!-- Antenna Glow Tip -->
                    <circle cx="100" cy="24" r="6" fill="#4df3ff" filter="url(#glow)"/>
                    <circle cx="100" cy="24" r="2.5" fill="#ffffff"/>

                    <!-- Main Robot Head Shape -->
                    <rect x="36" y="48" width="128" height="110" rx="55" fill="url(#headGrad)" stroke="rgba(140,185,255,0.3)" stroke-width="1.5"/>

                    <!-- Inner Face Visor Screen -->
                    <rect x="46" y="66" width="108" height="78" rx="38" fill="url(#visorGrad)" stroke="rgba(100,160,255,0.2)" stroke-width="1"/>

                    <!-- Visor Reflection Sheen -->
                    <path d="M 58 76 Q 100 68 142 76 Q 120 72 58 76 Z" fill="rgba(255, 255, 255, 0.08)"/>

                    <!-- Headset Side Ear Cups -->
                    <!-- Left Ear Cup -->
                    <rect x="28" y="86" width="12" height="30" rx="5" fill="url(#metalGrad)" stroke="rgba(150,200,255,0.4)" stroke-width="1"/>
                    <circle cx="34" cy="101" r="2.5" fill="#4df3ff" filter="url(#glow)"/>

                    <!-- Right Ear Cup -->
                    <rect x="160" y="86" width="12" height="30" rx="5" fill="url(#metalGrad)" stroke="rgba(150,200,255,0.4)" stroke-width="1"/>
                    <circle cx="166" cy="101" r="2.5" fill="#4df3ff" filter="url(#glow)"/>

                    <!-- Headset Microphone Arm -->
                    <path d="M 34 106 C 30 135, 55 142, 75 140" fill="none" stroke="#5a739c" stroke-width="2.5" stroke-linecap="round"/>
                    <circle cx="76" cy="140" r="3" fill="#6884b3"/>

                    <!-- Interactive Face Elements Group (Follows Pointer) -->
                    <g id="faceInteractiveGroup" class="eye-group">
                        
                        <!-- Left Eye ("A") -->
                        <g id="eyeLeftGroup">
                            <text id="eyeLeft" x="73" y="112" font-size="28" fill="#e0f7fc" text-anchor="middle" filter="url(#glow)" class="eye-text">A</text>
                        </g>

                        <!-- Right Eye ("Z") -->
                        <g id="eyeRightGroup">
                            <text id="eyeRight" x="127" y="112" font-size="28" fill="#e0f7fc" text-anchor="middle" filter="url(#glow)" class="eye-text">Z</text>
                        </g>

                        <!-- Cute Glasses Frame -->
                        <!-- Left Lens Circle -->
                        <circle cx="73" cy="104" r="19" fill="none" stroke="rgba(180, 220, 255, 0.7)" stroke-width="1.8"/>
                        <!-- Right Lens Circle -->
                        <circle cx="127" cy="104" r="19" fill="none" stroke="rgba(180, 220, 255, 0.7)" stroke-width="1.8"/>
                        <!-- Glasses Bridge -->
                        <path d="M 92 104 Q 100 100 108 104" fill="none" stroke="rgba(180, 220, 255, 0.7)" stroke-width="1.8" stroke-linecap="round"/>
                        
                        <!-- Glasses Glare Diagonal Shine Lines -->
                        <line x1="62" y1="94" x2="72" y2="90" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.5" stroke-linecap="round"/>
                        <line x1="116" y1="94" x2="126" y2="90" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.5" stroke-linecap="round"/>

                        <!-- Cute Small Curved Smile Mouth -->
                        <path d="M 92 126 Q 100 133 108 126" fill="none" stroke="#4df3ff" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)"/>

                    </g>
                </svg>